<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142f2b">
  <meta name="description" content="A pocket Action Chart for Lone Wolf Books 1 and 2. Carry your character between adventures.">
  <title>Lone Wolf · Action Chart</title>
  <link rel="stylesheet" href="styles.css?v=backpack1">
  <script src="rules.js?v=meals1" defer></script>
  <script src="campaign.js?v=gold-roll1" defer></script>
  <script src="app.js?v=backpack1" defer></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M7 7l10 7h6l10-7-3 20-10 8-10-8zM13 22l4 2m10-2-4 2M17 29h6"/></svg></div>
      <div class="brand"><h1>Action Chart</h1><div class="brand-subline"><span class="eyebrow">LONE WOLF</span><span class="save-state" id="save-state" role="status">Saved on device</span></div></div>
      <button class="icon-button" id="menu-button" aria-label="Open adventure menu">☰</button>
    </header>
    <div class="book-strip"><button id="book-button" data-action="books" aria-label="Switch books">01 / Flight from the Dark ▾</button><button class="section-bookmark" id="section-bookmark" data-action="bookmark" aria-label="Edit section bookmark">Section 1 ✎</button></div>
    <main id="main" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Action Chart sections"></nav>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
</body>
</html>
